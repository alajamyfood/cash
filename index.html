<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>صناديق العجمي</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d9488">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="العجمي">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Cairo', system-ui, sans-serif; }
    body {
      background: linear-gradient(165deg, #020617 0%, #0f172a 45%, #020617 100%);
      min-height: 100vh;
      color: #f8fafc;
    }
    .force-ltr {
      direction: ltr !important;
      display: inline-block;
      unicode-bidi: embed;
      font-variant-numeric: tabular-nums;
    }
    .card-glow {
      box-shadow: 0 0 50px -12px rgba(13, 148, 136, 0.28);
    }
    .toast-in { animation: toastIn 0.35s ease-out forwards; }
    @keyframes toastIn {
      from { transform: translate(-50%, 120%); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    .fade-in { animation: fadeIn 0.35s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-bg { background: rgba(2, 6, 23, 0.88); backdrop-filter: blur(10px); }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #0d9488; border-radius: 10px; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
    #lockScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: linear-gradient(165deg, #020617 0%, #0f172a 50%, #020617 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #lockScreen.hidden { display: none; }
  </style>
</head>
<body class="pb-28 pt-5 px-4 sm:px-6">

  <!-- شاشة كلمة المرور -->
  <div id="lockScreen">
    <div class="w-full max-w-sm bg-slate-900/90 border border-slate-700 rounded-3xl p-8 shadow-2xl text-center">
      <div class="w-16 h-16 mx-auto mb-5 rounded-2xl bg-gradient-to-br from-teal-600 to-teal-800 flex items-center justify-center text-3xl shadow-lg">
        🔒
      </div>
      <h2 class="text-2xl font-bold mb-2">صناديق العجمي</h2>
      <p class="text-slate-400 text-sm mb-6">أدخل كلمة المرور للدخول</p>
      
      <input 
        id="passwordInput" 
        type="password" 
        placeholder="••••••" 
        class="w-full bg-slate-800 border border-slate-600 focus:border-teal-500 rounded-2xl px-5 py-4 text-center text-2xl tracking-widest outline-none force-ltr mb-4"
        autocomplete="off"
      >
      
      <button onclick="checkPassword()" class="w-full bg-gradient-to-r from-teal-600 to-teal-700 hover:from-teal-500 hover:to-teal-600 py-3.5 rounded-2xl font-bold text-lg transition active:scale-[0.98]">
        دخول
      </button>
      
      <p id="passError" class="text-rose-400 text-sm mt-4 hidden">كلمة المرور غير صحيحة</p>
    </div>
  </div>

  <!-- التطبيق -->
  <div id="appContent" class="hidden max-w-2xl mx-auto">
    <header class="flex items-center justify-between mb-7">
      <div class="flex items-center gap-3">
        <div class="w-14 h-14 rounded-2xl overflow-hidden bg-gradient-to-br from-teal-600 to-teal-800 shadow-lg shadow-teal-900/40 flex items-center justify-center">
          <img src="logo.png" alt="العجمي" class="w-full h-full object-contain p-1" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
          <span class="text-2xl hidden">🥜</span>
        </div>
        <div>
          <h1 class="text-2xl sm:text-3xl font-black tracking-tight">صناديق العجمي</h1>
          <p class="text-teal-400/90 text-sm font-medium">إدارة الصناديق • منذ 1989</p>
        </div>
      </div>
      <button onclick="loadData()" class="w-11 h-11 rounded-xl bg-slate-800/80 border border-slate-700 flex items-center justify-center text-teal-400 hover:bg-slate-700 transition active:scale-95">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
    </header>

    <div id="totalCard" class="rounded-3xl p-5 mb-5 bg-gradient-to-br from-teal-800 via-teal-700 to-cyan-800 border border-teal-500/30 shadow-xl card-glow fade-in">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-12 h-12 rounded-2xl bg-white/15 flex items-center justify-center text-2xl">📊</div>
        <div>
          <h3 class="font-bold text-xl">إجمالي الصناديق</h3>
          <p class="text-teal-100/70 text-xs">عنتاب + اسطنبول + حلب</p>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3" id="totalBalances"></div>
    </div>

    <div class="grid grid-cols-1 gap-4 mb-7" id="fundsSummary"></div>

    <section class="bg-slate-900/70 border border-slate-800 rounded-3xl p-6 shadow-xl mb-6 card-glow">
      <h2 class="text-xl font-bold mb-5 flex items-center gap-2">
        <i class="fa-solid fa-plus-circle text-teal-400"></i>
        عملية جديدة
      </h2>
      <div class="space-y-5">
        <div>
          <label class="block text-slate-300 text-sm mb-2 font-medium">الصندوق</label>
          <select id="fund" onchange="updateCurrencyOptions()" class="w-full bg-slate-800/80 border border-slate-700 focus:border-teal-500 rounded-2xl px-4 py-3.5 text-base outline-none">
            <option value="gaziantep">صندوق عنتاب</option>
            <option value="istanbul">صندوق اسطنبول</option>
            <option value="aleppo">صندوق حلب</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 text-sm mb-2 font-medium">العملة</label>
            <select id="currency" class="w-full bg-slate-800/80 border border-slate-700 focus:border-teal-500 rounded-2xl px-4 py-3.5 text-base outline-none">
              <option value="USD">دولار (USD)</option>
              <option value="TRY">تركي (TRY)</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-300 text-sm mb-2 font-medium">النوع</label>
            <select id="type" onchange="updateOperationTypeColor()" class="w-full bg-slate-800/80 border border-slate-700 focus:border-teal-500 rounded-2xl px-4 py-3.5 text-base outline-none">
              <option value="income">إيداع (+)</option>
              <option value="expense">خصم (−)</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-slate-300 text-sm mb-2 font-medium">المبلغ</label>
          <input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" class="w-full bg-slate-800/80 border border-slate-700 focus:border-teal-500 rounded-2xl px-5 py-4 text-3xl font-bold text-center outline-none force-ltr">
        </div>
        <div>
          <label class="block text-slate-300 text-sm mb-2 font-medium">الوصف</label>
          <input id="description" type="text" placeholder="مثال: راتب • فاتورة • تحويل..." class="w-full bg-slate-800/80 border border-slate-700 focus:border-teal-500 rounded-2xl px-4 py-3.5 text-base outline-none">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 text-sm mb-2 font-medium">ملاحظات</label>
            <input id="notes" type="text" placeholder="تفاصيل إضافية..." class="w-full bg-slate-800/80 border border-slate-700 focus:border-teal-500 rounded-2xl px-4 py-3.5 text-base outline-none">
          </div>
          <div>
            <label class="block text-slate-300 text-sm mb-2 font-medium">سعر الصرف (اختياري)</label>
            <input id="exchange_rate" type="number" min="0" step="0.01" placeholder="مثال: 34.50" class="w-full bg-slate-800/80 border border-slate-700 focus:border-teal-500 rounded-2xl px-4 py-3.5 text-base outline-none force-ltr">
          </div>
        </div>
        <button onclick="addOperation()" id="submitBtn" class="w-full bg-gradient-to-r from-teal-600 to-teal-700 hover:from-teal-500 hover:to-teal-600 py-4 rounded-2xl font-bold text-lg shadow-lg shadow-teal-900/30 active:scale-[0.98] transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-check"></i>
          تسجيل العملية
        </button>
      </div>
    </section>

    <div class="mb-4">
      <button id="toggleFilterBtn" onclick="toggleFilter()" class="w-full bg-slate-800/80 hover:bg-slate-700 border border-slate-700 py-3.5 rounded-2xl font-bold text-sm transition flex items-center justify-center gap-2 text-teal-300">
        <i class="fa-solid fa-filter"></i>
        إظهار الفلتر
      </button>
    </div>

    <section id="filterSection" class="hidden bg-slate-900/70 border border-slate-800 rounded-3xl p-5 shadow-xl mb-6">
      <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
        <i class="fa-solid fa-filter text-teal-400"></i>
        فلتر متقدم
      </h2>
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div>
          <label class="block text-slate-400 text-xs mb-1">من تاريخ</label>
          <input type="date" id="dateFrom" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm">
        </div>
        <div>
          <label class="block text-slate-400 text-xs mb-1">إلى تاريخ</label>
          <input type="date" id="dateTo" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm">
        </div>
      </div>
      <div class="grid grid-cols-3 gap-2 mb-4">
        <div>
          <label class="block text-slate-400 text-xs mb-1">الصندوق</label>
          <select id="filterFund" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2 py-2.5 text-sm">
            <option value="">الكل</option>
            <option value="gaziantep">عنتاب</option>
            <option value="istanbul">اسطنبول</option>
            <option value="aleppo">حلب</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-400 text-xs mb-1">العملة</label>
          <select id="filterCurrency" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2 py-2.5 text-sm">
            <option value="">الكل</option>
            <option value="USD">دولار</option>
            <option value="TRY">تركي</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-400 text-xs mb-1">النوع</label>
          <select id="filterType" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2 py-2.5 text-sm">
            <option value="">الكل</option>
            <option value="income">إيداع</option>
            <option value="expense">خصم</option>
          </select>
        </div>
      </div>
      <div class="flex gap-2">
        <button onclick="applyFilter()" class="flex-1 bg-teal-600 hover:bg-teal-500 py-3 rounded-xl font-bold text-sm transition">تطبيق</button>
        <button onclick="clearFilter()" class="flex-1 bg-slate-700 hover:bg-slate-600 py-3 rounded-xl font-bold text-sm transition">مسح</button>
      </div>
      <button id="printFilterBtn" onclick="printFilterReport()" class="hidden w-full mt-3 bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-print"></i>
        طباعة تقرير الفلتر
      </button>
    </section>

    <section>
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold flex items-center gap-2">
          <i class="fa-solid fa-clock-rotate-left text-teal-400"></i>
          سجل العمليات
        </h2>
        <span id="filterStatus" class="text-xs text-slate-500 bg-slate-800/60 px-3 py-1 rounded-full">جميع العمليات</span>
      </div>
      <div id="historyList" class="space-y-3 max-h-[50vh] overflow-y-auto pr-1 pb-4"></div>
    </section>
  </div>

  <!-- Transaction Modal -->
  <div id="txModal" class="fixed inset-0 z-50 hidden modal-bg flex items-end sm:items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-3xl w-full max-w-md max-h-[92vh] overflow-y-auto shadow-2xl fade-in">
      <div class="p-6">
        <div class="flex items-center justify-between mb-5">
          <h3 class="text-xl font-bold">تفاصيل العملية</h3>
          <button onclick="closeModal()" class="w-9 h-9 rounded-xl bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div id="modalContent" class="space-y-4 text-sm"></div>
        <div class="mt-6 flex gap-3">
          <button onclick="printSingle()" class="flex-1 bg-teal-600 hover:bg-teal-500 py-3 rounded-xl font-bold flex items-center justify-center gap-2">
            <i class="fa-solid fa-print"></i> طباعة
          </button>
          <button onclick="closeModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 py-3 rounded-xl font-bold">إغلاق</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3.5 rounded-2xl text-white font-medium shadow-2xl flex items-center gap-3 z-50 min-w-[260px] justify-center hidden toast-in">
    <i id="toastIcon" class="fa-solid fa-circle-check text-lg"></i>
    <span id="toastMsg">تم</span>
  </div>

  <script>
    const APP_PASSWORD = "161192";

    function checkPassword() {
      const input = document.getElementById("passwordInput");
      const error = document.getElementById("passError");
      if (input.value === APP_PASSWORD) {
        sessionStorage.setItem("alajamy_unlocked", "1");
        document.getElementById("lockScreen").classList.add("hidden");
        document.getElementById("appContent").classList.remove("hidden");
        initApp();
      } else {
        error.classList.remove("hidden");
        input.value = "";
        input.focus();
        setTimeout(() => error.classList.add("hidden"), 2500);
      }
    }

    document.getElementById("passwordInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") checkPassword();
    });

    window.addEventListener("load", () => {
      if (sessionStorage.getItem("alajamy_unlocked") === "1") {
        document.getElementById("lockScreen").classList.add("hidden");
        document.getElementById("appContent").classList.remove("hidden");
        initApp();
      } else {
        document.getElementById("passwordInput").focus();
      }
    });

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwfTUufVVRWApjRXqP0sSyUZ5bOKIEBdVYP1h9di2FGJG-dRv_rIjfJVjXreFOVqoOFqw/exec";
    let currentTransaction = null;
    const FUND_NAMES = {
      gaziantep: "عنتاب",
      istanbul: "اسطنبول",
      aleppo: "حلب"
    };
    const FUND_CURRENCIES = {
      gaziantep: ["USD", "TRY"],
      istanbul: ["USD", "TRY"],
      aleppo: ["USD"]
    };
    let currentFilter = null;
    let allTransactions = [];
    let summary = {};

    function $(id) { return document.getElementById(id); }

    function formatNumber(num) {
      return Number(num || 0).toLocaleString("en-US", { maximumFractionDigits: 2 });
    }

    // ===================== معرّف الجهاز الثابت =====================
    function getDeviceId() {
      let deviceId = localStorage.getItem("alajamy_device_id");
      if (!deviceId) {
        deviceId = "DEV-" + Date.now().toString(36) + "-" + Math.random().toString(36).substring(2, 10);
        localStorage.setItem("alajamy_device_id", deviceId);
      }
      return deviceId;
    }

    function toggleFilter() {
      const section = $("filterSection");
      const btn = $("toggleFilterBtn");
      if (section.classList.contains("hidden")) {
        section.classList.remove("hidden");
        btn.innerHTML = `<i class="fa-solid fa-filter"></i> إخفاء الفلتر`;
      } else {
        section.classList.add("hidden");
        btn.innerHTML = `<i class="fa-solid fa-filter"></i> إظهار الفلتر`;
      }
    }

    async function loadData(filter = null, silent = false) {
  try {
    if (!silent) showToast("جاري التحميل...", false, true);

    // دائماً نجيب كل البيانات (بدون فلتر)
    const res = await fetch(SCRIPT_URL);
    const data = await res.json();

    if (data.status !== "success") throw new Error(data.message || "خطأ في جلب البيانات");

    // الرصيد الحقيقي دائماً
    summary = data.summary || {};

    // كل العمليات
    let transactions = data.transactions || [];

    // ===== تطبيق الفلتر هنا فقط على القائمة =====
    if (filter) {
      if (filter.from) {
        const fromDate = new Date(filter.from);
        fromDate.setHours(0, 0, 0, 0);
        transactions = transactions.filter(t => t.date && new Date(t.date) >= fromDate);
      }
      if (filter.to) {
        const toDate = new Date(filter.to);
        toDate.setHours(23, 59, 59, 999);
        transactions = transactions.filter(t => t.date && new Date(t.date) <= toDate);
      }
      if (filter.fund) {
        transactions = transactions.filter(t => t.fund === filter.fund);
      }
      if (filter.currency) {
        transactions = transactions.filter(t => t.currency === filter.currency);
      }
      if (filter.type) {
        transactions = transactions.filter(t => t.type === filter.type);
      }
    }

    allTransactions = transactions;
    currentFilter = filter;

    renderTotal();
    renderFunds();
    renderHistory();
    updateFilterStatus();
    updatePrintFilterBtn();

    if (!silent) showToast(filter ? "تم تطبيق الفلتر" : "تم التحديث", false);
  } catch (err) {
    console.error(err);
    showToast("تعذر الاتصال • تحقق من الإنترنت", true);
  }
}

    function renderTotal() {
      const usd = (summary.gaziantep?.USD || 0) + (summary.istanbul?.USD || 0) + (summary.aleppo?.USD || 0);
      const tryTotal = (summary.gaziantep?.TRY || 0) + (summary.istanbul?.TRY || 0);
      $("totalBalances").innerHTML = `
        <div class="bg-black/25 rounded-2xl p-4 text-center">
          <div class="text-teal-100/70 text-xs mb-1">إجمالي الدولار</div>
          <div class="text-2xl font-black force-ltr ${usd >= 0 ? 'text-white' : 'text-rose-300'}">$${formatNumber(usd)}</div>
        </div>
        <div class="bg-black/25 rounded-2xl p-4 text-center">
          <div class="text-teal-100/70 text-xs mb-1">إجمالي التركي</div>
          <div class="text-2xl font-black force-ltr ${tryTotal >= 0 ? 'text-white' : 'text-rose-300'}">${formatNumber(tryTotal)}</div>
        </div>
      `;
    }

    function renderFunds() {
      const container = $("fundsSummary");
      container.innerHTML = "";
      const funds = [
        { key: "gaziantep", name: "صندوق عنتاب", icon: "🏙️", colors: "from-teal-700 to-teal-900" },
        { key: "istanbul", name: "صندوق اسطنبول", icon: "🌉", colors: "from-cyan-700 to-cyan-900" },
        { key: "aleppo", name: "صندوق حلب", icon: "🏰", colors: "from-emerald-700 to-emerald-900" }
      ];
      funds.forEach(f => {
        const data = summary[f.key] || {};
        const currencies = FUND_CURRENCIES[f.key];
        let balancesHTML = currencies.map(curr => {
          const val = data[curr] ?? 0;
          return `
            <div class="flex items-center justify-between">
              <span class="text-slate-300 text-sm">${curr === "USD" ? "دولار" : "تركي"}</span>
              <span class="font-bold text-lg force-ltr ${val >= 0 ? "text-teal-300" : "text-rose-400"}">${curr === "USD" ? "$" : ""}${formatNumber(val)}</span>
            </div>`;
        }).join("");
        const card = document.createElement("div");
        card.className = `rounded-3xl p-5 bg-gradient-to-br ${f.colors} border border-white/5 shadow-xl fade-in`;
        card.innerHTML = `
          <div class="flex items-center gap-3 mb-4">
            <div class="w-11 h-11 rounded-xl bg-white/10 flex items-center justify-center text-2xl">${f.icon}</div>
            <div>
              <h3 class="font-bold text-lg">${f.name}</h3>
              <p class="text-white/60 text-xs">${currencies.join(" + ")}</p>
            </div>
          </div>
          <div class="space-y-2 bg-black/20 rounded-2xl p-4">${balancesHTML}</div>
        `;
        container.appendChild(card);
      });
    }

    function renderHistory() {
      const cont = $("historyList");
      cont.innerHTML = "";
      if (allTransactions.length === 0) {
        cont.innerHTML = `
          <div class="text-center py-16 text-slate-500">
            <i class="fa-solid fa-inbox text-4xl mb-3 opacity-40"></i>
            <p>لا توجد عمليات في هذه الفترة</p>
          </div>`;
        return;
      }
      allTransactions.forEach(op => {
        const isIncome = op.type === "income";
        const fundName = FUND_NAMES[op.fund] || op.fund;
        let dateStr = "—";
        if (op.date) {
          const d = new Date(op.date);
          dateStr = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")} - ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
        }
        const div = document.createElement("div");
        div.className = `flex gap-3 items-start bg-slate-900/60 border ${isIncome ? "border-green-900/40" : "border-red-900/40"} rounded-2xl p-4 fade-in cursor-pointer active:scale-[0.98] transition`;
        div.onclick = () => openModal(op);
        div.innerHTML = `
          <div class="w-10 h-10 rounded-xl ${isIncome ? "bg-green-500/20 text-green-400" : "bg-red-500/20 text-red-400"} flex items-center justify-center flex-shrink-0">
            <i class="fa-solid ${isIncome ? "fa-arrow-down" : "fa-arrow-up"}"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap mb-1">
              <span class="font-semibold text-base ${isIncome ? "text-green-200" : "text-red-200"} truncate">${op.description || "بدون وصف"}</span>
              <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">${fundName}</span>
              <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">${op.currency}</span>
            </div>
            <div class="text-xs text-slate-500">${dateStr}</div>
            ${op.notes && op.notes.trim() !== "" ? `
              <div class="text-xs text-slate-400 mt-1.5 bg-slate-800/40 rounded-lg px-2.5 py-1 line-clamp-1">${op.notes}</div>
            ` : ""}
          </div>
          <div class="text-left force-ltr flex-shrink-0">
            <div class="text-xl font-bold ${isIncome ? "text-green-400" : "text-red-400"}">
              ${isIncome ? "+" : "−"}${formatNumber(op.amount)}
            </div>
          </div>
        `;
        cont.appendChild(div);
      });
    }

    function openModal(op) {
      currentTransaction = op;
      const isIncome = op.type === "income";
      const fundName = FUND_NAMES[op.fund] || op.fund;
      let dateStr = "—";
      if (op.date) {
        const d = new Date(op.date);
        dateStr = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")} - ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
      }
      $("modalContent").innerHTML = `
        <div class="bg-slate-800/60 rounded-2xl p-4 space-y-3">
          <div class="flex justify-between"><span class="text-slate-400">النوع</span><span class="font-bold ${isIncome ? 'text-green-400' : 'text-red-400'}">${isIncome ? 'إيداع' : 'خصم'}</span></div>
          <div class="flex justify-between"><span class="text-slate-400">المبلغ</span><span class="font-bold text-lg force-ltr ${isIncome ? 'text-green-400' : 'text-red-400'}">${isIncome ? '+' : '−'}${formatNumber(op.amount)} ${op.currency}</span></div>
          <div class="flex justify-between"><span class="text-slate-400">الصندوق</span><span class="font-medium">${fundName}</span></div>
          <div class="flex justify-between"><span class="text-slate-400">التاريخ</span><span class="text-sm force-ltr">${dateStr}</span></div>
        </div>
        <div>
          <div class="text-slate-400 text-xs mb-1">الوصف</div>
          <div class="bg-slate-800/60 rounded-xl px-4 py-3 font-medium">${op.description || "—"}</div>
        </div>
        <div>
          <div class="text-slate-400 text-xs mb-1">الملاحظات</div>
          <div class="bg-slate-800/60 rounded-xl px-4 py-3">${op.notes && op.notes.trim() !== "" ? op.notes : "—"}</div>
        </div>
        <div>
          <div class="text-slate-400 text-xs mb-1">سعر الصرف</div>
          <div class="bg-slate-800/60 rounded-xl px-4 py-3 force-ltr">${op.exchange_rate ? formatNumber(op.exchange_rate) : "—"}</div>
        </div>
      `;
      $("txModal").classList.remove("hidden");
    }

    function closeModal() {
      $("txModal").classList.add("hidden");
      currentTransaction = null;
    }

    // ===================== دالة الطباعة =====================
    function doPrint(htmlContent) {
      let printWindow = null;
      try {
        printWindow = window.open("", "_blank");
        if (!printWindow) {
          showToast("المتصفح منع نافذة الطباعة. اسمح بالنوافذ المنبثقة وحاول مجدداً.", true);
          return;
        }

        const baseHref = new URL(".", window.location.href).href;

        const fullHtml = `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="${baseHref}">
  <title>طباعة - العجمي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Cairo', Arial, sans-serif;
      direction: rtl;
      background: #fff;
      color: #111;
      padding: 12mm;
      margin: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .print-actions {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      background: #fff;
      z-index: 9999;
    }
    .print-actions button {
      border: 0;
      border-radius: 10px;
      padding: 12px 20px;
      font: 700 15px 'Cairo', Arial, sans-serif;
      color: white;
      cursor: pointer;
    }
    .btn-print { background: #0d9488; }
    .btn-close { background: #475569; }
    table { width: 100%; border-collapse: collapse; }
    th, td { overflow-wrap: anywhere; }
    img { max-width: 100%; }
    @media print {
      @page { size: A4 portrait; margin: 10mm; }
      body { padding: 0; background: white; }
      .print-actions { display: none !important; }
      tr { break-inside: avoid; page-break-inside: avoid; }
      thead { display: table-header-group; }
    }
  </style>
</head>
<body>
  <div class="print-actions">
    <button class="btn-print" id="printNow">🖨️ طباعة التقرير</button>
    <button class="btn-close" id="closePrint">إغلاق</button>
  </div>
  <main id="reportContent">
    ${htmlContent}
  </main>
  <script>
    document.getElementById("printNow").addEventListener("click", function() {
      window.print();
    });
    document.getElementById("closePrint").addEventListener("click", function() {
      window.close();
    });
  <\/script>
</body>
</html>`;

        printWindow.document.open();
        printWindow.document.write(fullHtml);
        printWindow.document.close();
      } catch (error) {
        console.error("Print error:", error);
        if (printWindow && !printWindow.closed) printWindow.close();
        showToast("تعذر فتح صفحة الطباعة. حاول فتح التطبيق في Chrome.", true);
      }
    }

    function printSingle() {
      if (!currentTransaction) {
        showToast("لم يتم تحديد العملية", true);
        return;
      }
      const op = currentTransaction;
      const isIncome = op.type === "income";
      const fundName = FUND_NAMES[op.fund] || op.fund;
      let dateFull = "—";
      if (op.date) {
        const d = new Date(op.date);
        dateFull = d.toLocaleString("ar-SY", { dateStyle: "full", timeStyle: "short" });
      }
      const html = `
        <div style="text-align:center; margin-bottom:18px;">
          <img src="logo.png" alt="العجمي" style="height:55px; margin:0 auto 6px;" onerror="this.style.display='none'">
          <div style="font-size:18px; font-weight:900;">شركة العجمي</div>
          <div style="font-size:11px; color:#666;">صناديق الشركة • منذ 1989</div>
        </div>
        <div style="border-top:2px solid #0d9488; margin:12px 0 16px;"></div>
        <div style="font-size:15px; font-weight:700; text-align:center; margin-bottom:16px;">تفاصيل العملية</div>
        <table style="width:100%; border-collapse:collapse; font-size:13px; line-height:1.7;">
          <tr>
            <td style="padding:7px 0; color:#555; width:32%;">النوع</td>
            <td style="padding:7px 0; font-weight:700; color:${isIncome ? '#16a34a' : '#dc2626'};">${isIncome ? 'إيداع' : 'خصم'}</td>
          </tr>
          <tr>
            <td style="padding:7px 0; color:#555;">المبلغ</td>
            <td style="padding:7px 0; font-weight:700; font-size:16px; color:${isIncome ? '#16a34a' : '#dc2626'};">
              ${isIncome ? '+' : '−'}${formatNumber(op.amount)}
            </td>
          </tr>
          <tr>
            <td style="padding:7px 0; color:#555;">العملة</td>
            <td style="padding:7px 0;">${op.currency === "USD" ? "دولار أمريكي (USD)" : "ليرة تركية (TRY)"}</td>
          </tr>
          <tr>
            <td style="padding:7px 0; color:#555;">الصندوق</td>
            <td style="padding:7px 0;">صندوق ${fundName}</td>
          </tr>
          <tr>
            <td style="padding:7px 0; color:#555;">التاريخ</td>
            <td style="padding:7px 0;">${dateFull}</td>
          </tr>
          <tr>
            <td style="padding:7px 0; color:#555; vertical-align:top;">الوصف</td>
            <td style="padding:7px 0;">${op.description || "—"}</td>
          </tr>
          <tr>
            <td style="padding:7px 0; color:#555; vertical-align:top;">الملاحظات</td>
            <td style="padding:7px 0;">${(op.notes && op.notes.trim() !== "") ? op.notes : "—"}</td>
          </tr>
          <tr>
            <td style="padding:7px 0; color:#555;">سعر الصرف</td>
            <td style="padding:7px 0;">${op.exchange_rate ? formatNumber(op.exchange_rate) : "—"}</td>
          </tr>
        </table>
        <div style="border-top:1px solid #ddd; margin:22px 0 10px;"></div>
        <div style="text-align:center; font-size:10px; color:#888;">
          العجمي • منذ 1989<br>تم الطباعة من نظام إدارة الصناديق
        </div>
      `;
      doPrint(html);
    }

    function updateFilterStatus() {
      if (!currentFilter) {
        $("filterStatus").textContent = "جميع العمليات";
        return;
      }
      const parts = [];
      if (currentFilter.fund) parts.push(FUND_NAMES[currentFilter.fund]);
      if (currentFilter.currency) parts.push(currentFilter.currency);
      if (currentFilter.type) parts.push(currentFilter.type === "income" ? "إيداع" : "خصم");
      if (currentFilter.from || currentFilter.to) parts.push("فترة");
      $("filterStatus").textContent = parts.length ? parts.join(" • ") : "جميع العمليات";
    }

    function updatePrintFilterBtn() {
      const btn = $("printFilterBtn");
      if (currentFilter && allTransactions.length > 0) {
        btn.classList.remove("hidden");
      } else {
        btn.classList.add("hidden");
      }
    }

    function updateOperationTypeColor() {
      const select = $("type");
      if (!select) return;
      const isIncome = select.value === "income";
      select.style.color = isIncome ? "#4ade80" : "#f87171";
      select.style.borderColor = isIncome ? "rgba(34,197,94,.45)" : "rgba(239,68,68,.45)";
    }

    function updateCurrencyOptions() {
      const fund = $("fund").value;
      const select = $("currency");
      const allowed = FUND_CURRENCIES[fund] || ["USD"];
      select.innerHTML = allowed.map(c => `<option value="${c}">${c === "USD" ? "دولار (USD)" : "تركي (TRY)"}</option>`).join("");
    }

    async function addOperation() {
      const fund = $("fund").value;
      const currency = $("currency").value;
      const type = $("type").value;
      const amount = Number($("amount").value);
      const description = $("description").value.trim();
      const notes = $("notes").value.trim();
      const exchange_rate = $("exchange_rate").value ? Number($("exchange_rate").value) : null;
      if (!description) { highlight($("description")); return showToast("الوصف مطلوب", true); }
      if (!amount || amount <= 0) { highlight($("amount")); return showToast("أدخل مبلغ صحيح", true); }
      const btn = $("submitBtn");
      const original = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ...`;
      try {
        // ===== هنا التعديل المهم: إرسال id الجهاز =====
        const payload = {
          id: getDeviceId(),
          fund,
          currency,
          type,
          amount,
          description,
          notes,
          exchange_rate,
          date: new Date().toISOString()
        };
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.status !== "success") throw new Error(data.message || "فشل الحفظ");
        showToast(type === "income" ? `تم إيداع ${formatNumber(amount)}` : `تم خصم ${formatNumber(amount)}`);
        $("amount").value = "";
        $("description").value = "";
        $("notes").value = "";
        $("exchange_rate").value = "";
        await loadData(currentFilter, true);
      } catch (err) {
        showToast(err.message || "فشل في الحفظ", true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = original;
      }
    }

    function applyFilter() {
      const from = $("dateFrom").value;
      const to = $("dateTo").value;
      const fund = $("filterFund").value;
      const currency = $("filterCurrency").value;
      const type = $("filterType").value;
      const filter = {};
      if (from) filter.from = from;
      if (to) filter.to = to;
      if (fund) filter.fund = fund;
      if (currency) filter.currency = currency;
      if (type) filter.type = type;
      if (Object.keys(filter).length === 0) return showToast("اختر معيار فلترة واحد على الأقل", true);
      loadData(filter);
    }

    function clearFilter() {
      $("dateFrom").value = "";
      $("dateTo").value = "";
      $("filterFund").value = "";
      $("filterCurrency").value = "";
      $("filterType").value = "";
      loadData(null);
    }

    function printFilterReport() {
      if (!allTransactions.length) {
        return showToast("لا توجد عمليات للطباعة", true);
      }
      let periodText = "الكل";
      if (currentFilter?.from || currentFilter?.to) {
        periodText = `${currentFilter.from || "..."} ← ${currentFilter.to || "..."}`;
      }
      const fundText = currentFilter?.fund ? FUND_NAMES[currentFilter.fund] : "الكل";
      const currencyText = currentFilter?.currency || "الكل";
      const typeText = currentFilter?.type ? (currentFilter.type === "income" ? "إيداع" : "خصم") : "الكل";
      const totals = {};
      allTransactions.forEach(op => {
        const curr = op.currency || "USD";
        if (!totals[curr]) totals[curr] = { income: 0, expense: 0 };
        if (op.type === "income") {
          totals[curr].income += Number(op.amount) || 0;
        } else {
          totals[curr].expense += Number(op.amount) || 0;
        }
      });
      let summaryRows = "";
      Object.keys(totals).forEach(curr => {
        const t = totals[curr];
        const net = t.income - t.expense;
        const currLabel = curr === "USD" ? "دولار (USD)" : "تركي (TRY)";
        summaryRows += `
          <tr>
            <td style="padding:10px 8px; border:1px solid #cbd5e1; text-align:center; font-weight:600; background:#f8fafc;">${currLabel}</td>
            <td style="padding:10px 8px; border:1px solid #cbd5e1; text-align:center; color:#16a34a; font-weight:700;">+${formatNumber(t.income)}</td>
            <td style="padding:10px 8px; border:1px solid #cbd5e1; text-align:center; color:#dc2626; font-weight:700;">−${formatNumber(t.expense)}</td>
            <td style="padding:10px 8px; border:1px solid #cbd5e1; text-align:center; font-weight:800; color:${net >= 0 ? '#16a34a' : '#dc2626'};">
              ${net >= 0 ? '+' : '−'}${formatNumber(Math.abs(net))}
            </td>
          </tr>
        `;
      });
      const rows = allTransactions.map(op => {
        const isIncome = op.type === "income";
        const d = op.date ? new Date(op.date) : null;
        const dateStr = d ? `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}` : "—";
        const notes = (op.notes && op.notes.trim() !== "") ? op.notes : "—";
        return `
          <tr>
            <td style="padding:8px 6px; border:1px solid #e2e8f0; font-size:12px; white-space:nowrap; vertical-align:top;">${dateStr}</td>
            <td style="padding:8px 6px; border:1px solid #e2e8f0; font-size:12px; word-break:break-word; vertical-align:top;">${op.description || "—"}</td>
            <td style="padding:8px 6px; border:1px solid #e2e8f0; font-size:12px; word-break:break-word; vertical-align:top; color:#475569;">${notes}</td>
            <td style="padding:8px 6px; border:1px solid #e2e8f0; font-size:12px; text-align:center; vertical-align:top;">${op.currency || "—"}</td>
            <td style="padding:8px 6px; border:1px solid #e2e8f0; font-size:12px; text-align:center; font-weight:700; color:${isIncome ? '#16a34a' : '#dc2626'}; vertical-align:top;">
              ${isIncome ? "+" : "−"}${formatNumber(op.amount)}
            </td>
          </tr>
        `;
      }).join("");
      const html = `
        <div style="text-align:center; margin-bottom:16px;">
          <img src="logo.png" alt="العجمي" style="height:50px; margin:0 auto 6px;" onerror="this.style.display='none'">
          <div style="font-size:17px; font-weight:900;">شركة العجمي</div>
          <div style="font-size:11px; color:#666;">تقرير العمليات المفلترة</div>
        </div>
        <div style="background:#f1f5f9; padding:12px 14px; border-radius:8px; margin-bottom:18px; font-size:13px; color:#334155; border:1px solid #e2e8f0;">
          <div style="display:flex; flex-wrap:wrap; gap:12px 22px; justify-content:center; text-align:center;">
            <div><span style="color:#64748b;">الفترة:</span> <strong>${periodText}</strong></div>
            <div><span style="color:#64748b;">الصندوق:</span> <strong style="color:#0d9488;">${fundText}</strong></div>
            <div><span style="color:#64748b;">العملة:</span> <strong>${currencyText}</strong></div>
            <div><span style="color:#64748b;">النوع:</span> <strong>${typeText}</strong></div>
          </div>
          <div style="margin-top:8px; text-align:center; font-size:12px; color:#64748b;">
            عدد العمليات: <strong style="color:#0f172a;">${allTransactions.length}</strong>
          </div>
        </div>
        <table style="width:100%; border-collapse:collapse; table-layout:fixed; font-size:12px;">
          <thead>
            <tr>
              <th style="padding:10px 6px; background:#0d9488; color:white; text-align:right; width:15%; border:1px solid #0d9488;">التاريخ</th>
              <th style="padding:10px 6px; background:#0d9488; color:white; text-align:right; width:28%; border:1px solid #0d9488;">الوصف</th>
              <th style="padding:10px 6px; background:#0d9488; color:white; text-align:right; width:27%; border:1px solid #0d9488;">الملاحظات</th>
              <th style="padding:10px 6px; background:#0d9488; color:white; text-align:center; width:12%; border:1px solid #0d9488;">العملة</th>
              <th style="padding:10px 6px; background:#0d9488; color:white; text-align:center; width:18%; border:1px solid #0d9488;">المبلغ</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>
        <div style="margin-top:28px;">
          <div style="font-size:14px; font-weight:800; margin-bottom:12px; color:#0d9488; border-bottom:2px solid #0d9488; padding-bottom:6px; text-align:center;">
            ملخص التقرير • الناتج النهائي
          </div>
          <table style="width:100%; border-collapse:collapse; font-size:13px;">
            <thead>
              <tr>
                <th style="padding:10px 8px; background:#0d9488; color:white; text-align:center; width:25%; border:1px solid #0d9488;">العملة</th>
                <th style="padding:10px 8px; background:#0d9488; color:white; text-align:center; width:25%; border:1px solid #0d9488;">إجمالي الإيداع</th>
                <th style="padding:10px 8px; background:#0d9488; color:white; text-align:center; width:25%; border:1px solid #0d9488;">إجمالي الخصم</th>
                <th style="padding:10px 8px; background:#0d9488; color:white; text-align:center; width:25%; border:1px solid #0d9488;">الصافي</th>
              </tr>
            </thead>
            <tbody>
              ${summaryRows}
            </tbody>
          </table>
        </div>
        <div style="border-top:1px solid #ddd; margin:24px 0 8px; padding-top:10px;">
          <div style="text-align:center; font-size:10px; color:#888;">العجمي • منذ 1989 • تم الطباعة من نظام إدارة الصناديق</div>
        </div>
      `;
      doPrint(html);
    }

    function highlight(el) {
      el.classList.add("!border-rose-500", "!ring-2", "!ring-rose-500/30");
      setTimeout(() => el.classList.remove("!border-rose-500", "!ring-2", "!ring-rose-500/30"), 1800);
      el.focus();
    }

    function showToast(msg, isError = false, loading = false) {
      const toast = $("toast");
      $("toastMsg").textContent = msg;
      $("toastIcon").className = loading ? "fa-solid fa-spinner fa-spin text-lg" : isError ? "fa-solid fa-circle-exclamation text-lg" : "fa-solid fa-circle-check text-lg";
      toast.className = `fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3.5 rounded-2xl text-white font-medium shadow-2xl flex items-center gap-3 z-50 min-w-[260px] justify-center toast-in ${isError ? "bg-rose-700" : "bg-teal-600"}`;
      toast.classList.remove("hidden");
      if (!loading) setTimeout(() => toast.classList.add("hidden"), 3500);
    }

    $("txModal").addEventListener("click", e => {
      if (e.target === $("txModal")) closeModal();
    });

    function initApp() {
      const today = new Date().toISOString().split("T")[0];
      $("dateTo").value = today;
      updateCurrencyOptions();
      loadData();
      updateOperationTypeColor();
    }

    $("amount").addEventListener("keypress", e => {
      if (e.key === "Enter") addOperation();
    });
  </script>
</body>
</html>
